void scara_ik(float x, float z, float L1, float L2, scara_ik_t *o)
{

    const float c2 = (r2 - L1 * L1 - L2 * L2) / (2.0f * L1 * L2);

void traj_plan(float D, float vmax, float amax, float jmax, traj_plan_t *o)

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      # le C training n'est pas en CI (données TinyStories gitignorées + gcc
      # natif) — la suite de benchmarks C reproductible est une issue v1.0

  # SPEAR-T1 : le modèle dont l'inférence ne contient AUCUN flottant.
  # Ces tests ne dépendent pas du corpus (le harnais les exécute sans données) :
  # bornes des noyaux vs libm, invariants du moteur, et désassemblage qui prouve
  # mécaniquement l'absence d'instruction flottante.
  spear-t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compilation
        run: |
          cd lm_cpu
          cc -O3 -funroll-loops -march=native -ffast-math -fopenmp -o ti_main ti_main.c -lm
          cc -O3 -funroll-loops -march=native -ffast-math -o ti_test ti_test.c -lm
      - name: bornes des noyaux (vs libm)
        run: cd lm_cpu && ./ti_test --kernels
      - name: invariants du moteur (préfixage = décodage au bit près)
        run: cd lm_cpu && ./ti_test --engine
      - name: aucune instruction flottante dans l'inférence
        run: cd lm_cpu && ./ti_main --fpcheck

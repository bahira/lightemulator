name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test

  c-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build C (gcc, scalaire — pas de données TinyStories en CI)
        run: gcc -O2 -ffast-math -o /tmp/lm_verify lm_c/verify_kernels.c -lm
      - name: kernels SPEAR — vérification + microbench
        run: |
          /tmp/lm_verify | tee /tmp/verify_out.txt
          ! grep -q 'FAUX' /tmp/verify_out.txt
      # le training e2e reste hors CI (données TinyStories gitignorées) —
      # la vérification des kernels + microbench est reproductible sans données

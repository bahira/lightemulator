name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      # le C training n'est pas en CI (données TinyStories gitignorées + gcc
      # natif) — la suite de benchmarks C reproductible est une issue v1.0
